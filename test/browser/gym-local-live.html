  <script>
    // Isolated in-memory userscript storage; no API key or real account data.
    window.__gymFixtureStore = Object.create(null);
    window.GM_getValue = (key, fallback) => Object.prototype.hasOwnProperty.call(window.__gymFixtureStore, key)
      ? window.__gymFixtureStore[key] : fallback;
    window.GM_setValue = (key, value) => { window.__gymFixtureStore[key] = value; };
    window.GM_deleteValue = key => { delete window.__gymFixtureStore[key]; };
    window.GM_setClipboard = value => { window.__gymFixtureClipboard = value; };
    window.GM_xmlhttpRequest = options => options.onerror?.({ error: "fixture network disabled" });
    document.getElementById('emit-result').addEventListener('click', () => {
      const result = document.createElement('div');
      result.textContent = "You used 100 energy and 0 happiness training your speed 10 times in George's increasing it by 1,000.00 to 100,000.00";
      document.querySelector('.fixture-bar').appendChild(result);
    });
